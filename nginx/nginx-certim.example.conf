# Certim Agent API 的 Nginx 反向代理示例。
#
# 要求：
#   - 代理必须把直连客户端地址追加到 X-Forwarded-For 链尾（用
#     $proxy_add_x_forwarded_for）。Certim 仅在 TCP 直连对端属于
#     server.trusted_proxies（默认回环网段）时才信任该头，并从最近一跳起
#     取链上第一个非可信地址作为真实客户端。
#   - 切勿把客户端的 X-Forwarded-For 原样透传：只有当可信代理在链尾追加了
#     自己的对端地址时，客户端伪造的链头才会被跳过。
#   - 本机部署时默认的 trusted_proxies 已覆盖 127.0.0.0/8；Nginx 不在本机
#     时需把代理机器的地址加入该配置（如 10.0.0.5/32）。
#   - OSS 预签名 URL 由 Agent 直接向阿里云 OSS 获取，不经过本代理。
#
# 安装为 /etc/nginx/conf.d/certim.conf，并按需调整路径和域名。

upstream certim_agent_api {
    # /etc/certim/config.yaml 中 server.listen 配置的地址。
    server 127.0.0.1:9080;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name certim.example.com;

    # 使用本 Nginx 信任的证书终结 TLS。
    ssl_certificate     /etc/nginx/ssl/certim.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/certim.example.com/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://certim_agent_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 追加直连对端到链尾；Certim 取链上距它最近的非可信代理地址。
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Host $host;

        # 下载会话端点会预签名 OSS URL，允许慢客户端。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Agent API 响应（密钥和 Token）永不缓存。
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
}
