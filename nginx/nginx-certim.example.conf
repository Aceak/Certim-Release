# Certim Agent API 的 Nginx 反向代理示例。
#
# 要求：
#   - 代理必须把 X-Forwarded-For 覆盖为单个客户端 IP。Certim 会拒绝
#     逗号分隔的转发链并回退到 TCP 对端地址，因此标准代理链会记录并授权
#     代理地址而非 Agent 地址。
#   - OSS 预签名 URL 由 Agent 直接向阿里云 OSS 获取，不经过本代理。
#
# 安装为 /etc/nginx/conf.d/certim.conf，并按需调整路径和域名。

upstream certim_agent_api {
    # /etc/certim/config.yaml 中 server.listen 配置的地址。
    server 127.0.0.1:9080;
    keepalive 16;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name certim.example.com;

    # 使用本 Nginx 信任的证书终结 TLS。
    ssl_certificate     /etc/nginx/ssl/certim.example.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/certim.example.com/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://certim_agent_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # 覆盖而不是追加：Certim 只接受单个客户端 IP。
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Host $host;

        # 下载会话端点会预签名 OSS URL，允许慢客户端。
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Agent API 响应（密钥和 Token）永不缓存。
        proxy_cache off;
        add_header Cache-Control "no-store" always;
    }
}
