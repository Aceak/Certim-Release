# =============================================================================
# ctnode Agent 配置
# =============================================================================
# Agent 自动发现已获授权的证书，无需在配置中逐个填写域名。
# 不保存 DNS 或云存储凭据。仅 Ed25519 身份密钥保留在本机。
# =============================================================================

server:
  # ---- 服务端地址 ----
  # Certim Agent API 的 HTTPS 地址。无默认值:注册时由
  # 'ctnode enroll --url <url>' 写入本文件。
  # 生产环境必须使用 HTTPS，仅测试环境可降级为 HTTP。
  # url: "https://certim.example.com"

  # ---- 跳过 TLS 验证 ----
  # 禁用 HTTPS 证书验证。开启后同时失去 Server 身份验证能力。
  # 仅用于自签名测试环境。生产环境必须设为 false。
  insecure_skip_verify: false

# =============================================================================
# 身份
# =============================================================================
identity:
  # ---- 身份密钥 ----
  # Ed25519 密钥路径。首次 enroll 时自动生成，权限 0600。
  # 私钥永不离开本机，Certim 服务端仅存储公钥。
  key: "/var/lib/ctnode/identity.key"

# =============================================================================
# 轮询
# =============================================================================
poll:
  # ---- 轮询间隔 ----
  # 正常证书版本检查间隔，裸数字按天解释。推荐 7d，最大 14d。
  # 同步失败后进入独立重试退避，不会等待下一个 poll.interval。
  interval: "7d"

  # ---- 随机偏移 ----
  # 每次轮询的随机偏移比例，避免大量 Agent 同时请求。
  # 实际间隔 = interval * (1 ± jitter)。
  jitter: "10%"

# =============================================================================
# 存储
# =============================================================================
storage:
  # ---- 证书部署根目录 ----
  # 已授权证书部署到 <root>/<certificate-name>/。
  # 证书名称由 Server 端验证为安全路径段。
  root: "/etc/certim/certificates"

  # ---- 移除未授权证书 ----
  # 当 Server 撤销此 Agent 的证书访问权限后，是否删除本地文件。
  # 默认关闭，避免权限配置失误直接造成线上中断。
  remove_unauthorized: false

  # ---- 输出格式 ----
  outputs:
    # 额外生成 certificate.pem 和 chain.pem（权限 0644）。
    # fullchain.pem 和 key.pem 始终生成。
    split: false

    # 额外生成 certificate.pfx 和 password.txt（权限 0600）。
    # 每次部署使用密码学安全随机数生成新密码。
    pfx: false

# =============================================================================
# 部署 Hook
# =============================================================================
deploy:
  # ---- 配置检查 ----
  # 部署完成后执行的配置校验命令（argv 数组，不走 shell）。
  # 空数组禁用此 Hook。每个命令 30 秒超时。
  # 同批次多证书修改后只执行一次。
  check: ["nginx", "-t"]

  # ---- 服务重载 ----
  # 校验通过后执行的重载命令。
  # 失败会回滚本批次全部证书文件。
  reload: ["systemctl", "reload", "nginx"]
