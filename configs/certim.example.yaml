# =============================================================================
# Certim 服务端配置
# =============================================================================
# 此文件仅保存引导设置。ACME 账户、DNS 凭据、Storage Profile 和证书通过本地
# CLI 动态管理并存储在 SQLite 中。敏感内容写入 .credentials 目录，不进入 SQLite。
#
# 如果配置文件不存在，certim serve 会自动创建最小配置并退出，编辑后重新启动即可。
# =============================================================================

server:
  # ---- Agent API ----
  # certim 对外提供 Agent 的 HTTPS API 监听地址。
  # 生产环境建议在本地址前放置反向代理，由防火墙限制来源 IP。
  listen: "127.0.0.1:9080"

  # ---- 本地管理 Socket ----
  # CLI 与 certim 通信的 Unix Socket 路径，使用 HTTP/1.1 + JSON。
  # 父目录会在启动时自动创建，权限收紧为 0750。
  control_socket: "/run/certim/certim.sock"

  # ---- 数据目录 ----
  # SQLite、证书不可变本地版本和审计日志的存储位置。
  # 子目录和文件由 certim 管理，首次启动自动创建。
  data_dir: "/var/lib/certim"

  # ---- 证书落盘目录 ----
  # 签发后的证书固定写入 <目录>/<证书名>/，续期直接覆盖。
  certificates_dir: "/etc/certim/.certificates"

  # ---- 凭据目录 ----
  # ACME 账户密钥、DNS Provider 凭据等敏感文件的存储目录。
  # 权限收紧为 0700，每个凭据文件为 0600。
  credentials_dir: "/etc/certim/.credentials"

  # ---- 真实 IP ----
  # 携带客户端 IP 链的 Header，由可信反向代理追加（nginx 用
  # $proxy_add_x_forwarded_for），不要覆盖为单个 $remote_addr。
  real_ip_header: "X-Forwarded-For"

  # ---- 可信代理 ----
  # 仅当 TCP 直连对端属于这些网段时才信任上面的 Header，并从最近一跳起取
  # 链上第一个非可信地址。只列代理机器本身（如 10.0.0.5/32），切勿把包含
  # 客户端或 Agent 的网段（如整个 LAN）列入，否则伪造的头值会生效。
  # 显式空列表 [] 表示永不信任；写空值/null 等同于不配置，会回落到回环网段。
  trusted_proxies: ["127.0.0.0/8", "::1/128"]

  # ---- 访问日志 ----
  # HTTP 访问日志，与运行日志（stdout/journal）分开。目录在启动时创建。
  access_log: "/var/log/certim/access.log"

  # ---- 对外地址（可选）----
  # Agent API 的公网 HTTPS 地址。配置后 'certim enrollment create'
  # 会直接打印一条可直接粘贴的 ctnode join 命令。
  # public_url: "https://certim.example.com"

# 动态设置命令：
#   certim acme profile add
#   certim dns profile add
#   certim storage profile add
#   certim cert add
#
# ACME 预设：letsencrypt-production、letsencrypt-staging、zerossl、
# google-public-ca，或自定义 RFC 8555 Directory URL。邮箱保存在所选 ACME
# Profile 上。ZeroSSL/Google/自定义 CA 可能需要 EAB。
#
# DNS Provider：AliDNS 和 Cloudflare。
# Storage Provider：local-only 和 Aliyun OSS。每个版本都先写入不可变本地目录，
# OSS 仅作为可选的分发副本。

# =============================================================================
# ACME 续期设置
# =============================================================================
acme:
  # ---- 续期提前窗口 ----
  # 证书距离到期此天数内触发自动续期。
  # 支持格式: "30d", "720h"。推荐 30d，最大 60d。
  renew_before: "30d"

  # ---- 状态检查间隔 ----
  # certim 按此间隔检查是否需要续期。
  # 续期失败后会进入独立的重试退避，不会等待下一个 check_interval。
  # 支持格式: "7d", "168h"。推荐 7d，最大 14d。
  check_interval: "7d"

# =============================================================================
# OSS 预签名
# =============================================================================
presign:
  # ---- Presigned URL 有效期 ----
  # Agent 下载证书的 OSS 预签名 URL 有效期。
  # 支持格式: "5m", "300s"。
  expires: "5m"

# =============================================================================
# 认证与安全
# =============================================================================
auth:
  # ---- Enrollment Token 有效期 ----
  # 服务端创建 Token 后，Agent 必须在此时间内完成注册。
  # 与内置默认值一致；单个 Token 可通过 --ttl 覆盖。
  enrollment_ttl: "30m"

  # ---- 时间戳偏差 ----
  # Agent 请求时间戳允许的最大偏差。
  timestamp_skew: "2m"

  # ---- 防重放窗口 ----
  # 同一 Nonce 在此时间内不可重复使用。
  # 必须至少为 timestamp_skew 的两倍。
  replay_ttl: "5m"
