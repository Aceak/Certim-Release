# Certim 组件升级兼容性规则。
#
# install.sh upgrade 在任何文件写入之前读取本文件做兼容性检查:
#   - 本地执行(仓库目录旁)时直接读取本文件;
#   - 在线执行(curl | bash)时从 main 分支下载本文件;
#   - 下载失败时告警并跳过兼容性检查(fail-open)。
#
# 维护方式: 新增版本约束时按下方语法在文件末尾追加规则, 无需修改脚本。
#
# 语法说明:
#   - `#` 开头为注释, 空行忽略; 每行一条规则, 字段以空白分隔。
#   - 版本号前缀 v 可省略; 按语义化版本比较, 预发布版本(如 1.0.0-rc1)
#     低于对应正式版。
#   - 约束算子: >=  <=  ==  >  <
#
# 规则一 requires (阻断):
#   升级 <pkg> 到满足 <op> <target> 的版本时, 本机 <dep> 必须满足
#   <dep_op> <dep_ver>; 否则阻断升级。
#   <dep> 未安装或版本不可解析时无法本机校验, 仅提示, 不阻断。
#   语法: requires <pkg> <op> <target> <dep> <dep_op> <dep_ver>
#
# 规则二 step (阻断):
#   当前版本低于 <via> 时, 不允许直接升级到满足 <op> <target> 的版本,
#   必须先升级到 <via> 再升目标版本。
#   语法: step <pkg> <op> <target> via <via>
#
# 规则三 matrix (告警):
#   同一主机上 <pkg> 与 <dep> 分别满足各自约束时, 版本矩阵不兼容,
#   仅告警不阻断。
#   语法: matrix <pkg> <op> <target> <dep> <dep_op> <dep_ver>
#
# 示例(当前无已知约束, 示例规则均已注释; 按需取消注释或仿写新规则):
#   requires ctnode >= 1.1.0 certim >= 1.0.0
#   step     certim >= 1.0.0 via 0.9.0
#   matrix   certim >= 1.0.0 ctnode < 0.8.0
